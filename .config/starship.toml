format = "$username$hostname$localip$shlvl$directory${custom.jj}$all\n"

[hostname]
ssh_symbol = "󰖟 "
format = '[$ssh_symbol](blue)[$hostname]($style) in '
style = "bold green"

[username]
format = "[$user](bold underline red) "

[directory]
format = '[  $path]($style)[$read_only]($read_only_style) '
read_only = "󰌾 "

[custom.jj]
when = "jj-starship detect"
shell = ["jj-starship"]
format = "$output "

[git_branch]
disabled = true

[git_commit]
disabled = true

[git_state]
disabled = true

[git_metrics]
disabled = true

[git_status]
disabled = true

